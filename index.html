<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Operations Report</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f6f8;
}

.header {
    background: #ffffff;
    padding: 20px 30px;
    border-bottom: 1px solid #eee;
}

.header h1 {
    margin: 0;
    font-size: 26px;
}

.container {
    padding: 25px;
}

.cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
}

.card {
    background: white;
    padding: 22px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.06);
}

.card h3 {
    margin: 0 0 10px;
    font-size: 14px;
    color: #777;
}

.card p {
    margin: 0;
    font-size: 30px;
    font-weight: bold;
}

.table-box {
    margin-top: 25px;
    background: white;
    padding: 20px;
    border-radius: 12px;
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    padding: 12px;
    border-bottom: 1px solid #eee;
    text-align: left;
}

th {
    background: #f8f8f8;
}

button {
    padding: 10px 18px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    background: #111;
    color: white;
}

@media(max-width:800px) {
    .cards {
        grid-template-columns: repeat(2, 1fr);
    }
}
</style>
</head>

<body>

<div class="header">
    <h1>Operations Dashboard</h1>
</div>

<div class="container">

    <button onclick="loadData()">🔄 Refresh Report</button>

    <div class="cards">

        <div class="card">
            <h3>Total Assigned</h3>
            <p id="assigned">0</p>
        </div>

        <div class="card">
            <h3>Delivered</h3>
            <p id="delivered">0</p>
        </div>

        <div class="card">
            <h3>Return</h3>
            <p id="return">0</p>
        </div>

        <div class="card">
            <h3>Pending</h3>
            <p id="pending">0</p>
        </div>

    </div>

    <div class="table-box">

        <h2>Hub Report</h2>

        <table>

            <thead>
                <tr>
                    <th>Date</th>
                    <th>Hub</th>
                    <th>Assigned</th>
                    <th>Delivered</th>
                    <th>Return</th>
                    <th>Pending</th>
                    <th>Agent</th>
                </tr>
            </thead>

            <tbody id="report"></tbody>

        </table>

    </div>

</div>

<script>

const SHEET_ID = "1M2TTm9TNa1g3tclvC2W8zhdcD4oy-m8ws6mydW-uH-c/edit?gid=0#gid=0";

const SHEET_NAME = "Daily Backlog💣";

async function loadData() {

    const url =
    `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${SHEET_NAME}`;

    const response = await fetch(url);

    const text = await response.text();

    const json =
    JSON.parse(text.substring(47).slice(0,-2));

    const rows = json.table.rows;

    let assigned = 0;
    let delivered = 0;
    let returns = 0;
    let pending = 0;

    let html = "";

    rows.forEach(row => {

        const c = row.c;

        const date = c[0]?.v || "";
        const hub = c[1]?.v || "";
        const a = Number(c[2]?.v || 0);
        const d = Number(c[3]?.v || 0);
        const r = Number(c[4]?.v || 0);
        const p = Number(c[5]?.v || 0);
        const agent = c[6]?.v || 0;

        assigned += a;
        delivered += d;
        returns += r;
        pending += p;

        html += `
        <tr>
            <td>${date}</td>
            <td>${hub}</td>
            <td>${a}</td>
            <td>${d}</td>
            <td>${r}</td>
            <td>${p}</td>
            <td>${agent}</td>
        </tr>
        `;
    });

    document.getElementById("assigned").innerText = assigned;
    document.getElementById("delivered").innerText = delivered;
    document.getElementById("return").innerText = returns;
    document.getElementById("pending").innerText = pending;

    document.getElementById("report").innerHTML = html;
}

loadData();

</script>

</body>
</html>
